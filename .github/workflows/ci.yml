name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gestor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/gestor_test
    steps:
      - uses: actions/checkout@v7
      # Sin `version:` a propósito. La acción lee `packageManager` de
      # `package.json` (`pnpm@9.15.9`) y se niega a arrancar si la versión
      # está declarada en los dos lados: prefiere fallar antes que instalar
      # una y resolver con otra. Una sola fuente de verdad, y es la del
      # repositorio.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # La fuga que esto vigila —una dependencia hacia @gc/ai materializada en
      # el node_modules de un paquete que la web arrastra— no rompe el build,
      # ni el typecheck, ni las pruebas. Sin este paso, CI queda verde con el
      # agujero abierto y el único detector depende de que alguien se acuerde.
      - name: Comprobar aislamiento de la web respecto del modelo
        run: pnpm comprobar:aislamiento
      # Mismo motivo que el paso de arriba, otra fuga: si un paquete nuevo del
      # workspace no tiene su volumen en docker-compose.yml, el `pnpm install`
      # del contenedor pisa los node_modules del host. Nada de lo que corre en
      # CI toca el contenedor, así que sin este paso el olvido no lo ve nadie
      # hasta que a alguien se le rompe la instalación local.
      - name: Comprobar volúmenes del worker en docker-compose
        run: pnpm comprobar:volumenes
      - run: pnpm test
