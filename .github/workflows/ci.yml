name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gestor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/gestor_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # La fuga que esto vigila —una dependencia hacia @gc/ai materializada en
      # el node_modules de un paquete que la web arrastra— no rompe el build,
      # ni el typecheck, ni las pruebas. Sin este paso, CI queda verde con el
      # agujero abierto y el único detector depende de que alguien se acuerde.
      - name: Comprobar aislamiento de la web respecto del modelo
        run: pnpm comprobar:aislamiento
      - run: pnpm test
